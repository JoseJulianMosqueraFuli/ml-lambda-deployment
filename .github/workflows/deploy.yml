name: Deploy to AWS Lambda

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: ml-iris-predictor

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests before deploy
        run: poetry run pytest tests/ -v --tb=short

      - name: Train model
        run: poetry run train

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        id: image
        run: |
          # Terraform creates one repository per environment: <function>-<environment>.
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.LAMBDA_FUNCTION_NAME }}-${{ inputs.environment }}:${{ github.sha }}"
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --file docker/Dockerfile \
            --tag "${IMAGE_URI}" \
            .
          docker push "${IMAGE_URI}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Deploy Lambda function
        run: |
          FUNCTION_NAME="${{ env.LAMBDA_FUNCTION_NAME }}-${{ inputs.environment }}"
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --publish

      - name: Wait for function update
        run: |
          FUNCTION_NAME="${{ env.LAMBDA_FUNCTION_NAME }}-${{ inputs.environment }}"
          aws lambda wait function-updated --function-name "${FUNCTION_NAME}"

      - name: Smoke test
        run: |
          FUNCTION_NAME="${{ env.LAMBDA_FUNCTION_NAME }}-${{ inputs.environment }}"
          aws lambda invoke \
            --function-name "${FUNCTION_NAME}" \
            --payload '{"body": "{\"features\": [5.1, 3.5, 1.4, 0.2]}"}' \
            --cli-binary-format raw-in-base64-out \
            output.json

          echo "Lambda Response:"
          python -m json.tool output.json

          # Verify successful response
          STATUS=$(python -c "import json; print(json.load(open('output.json')).get('statusCode', 500))")
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Lambda returned status $STATUS"
            exit 1
          fi
          echo "Smoke test passed!"
