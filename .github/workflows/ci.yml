name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check src/ tests/

      - name: Type check with mypy
        run: poetry run mypy src/ --ignore-missing-imports

      - name: Format check with black
        run: poetry run black --check src/ tests/

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/ \
            --cov=src/ml_lambda \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Security scan with bandit
        run: |
          pip install bandit
          bandit -r src/ -ll

  package:
    name: Build & Smoke Test Container Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Train model
        run: poetry run train

      - name: Build Lambda container image
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --file docker/Dockerfile \
            --tag ml-iris-predictor:${{ github.sha }} \
            .

      - name: Smoke test image with the Lambda Runtime Interface Emulator
        run: |
          docker run --detach --name lambda-smoke --publish 9000:8080 ml-iris-predictor:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output response.json \
              --data '{"body": "{\"features\": [5.1, 3.5, 1.4, 0.2]}"}' \
              http://localhost:9000/2015-03-31/functions/function/invocations; then
              break
            fi
            sleep 2
          done
          docker logs lambda-smoke
          python -m json.tool response.json
          STATUS=$(python -c "import json; print(json.load(open('response.json')).get('statusCode', 500))")
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: container returned status $STATUS"
            exit 1
          fi
          echo "Container smoke test passed!"

      - name: Stop smoke test container
        if: always()
        run: docker rm --force lambda-smoke || true
